<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Life OS</title>
<meta name="description" content="Budget, work tasks, gym, style and habits in one phone app that works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070D">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="dock" aria-label="Sections" hidden></nav>
</div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Locked" hidden></div>
<noscript><p style="padding:24px;color:#fff">Life OS needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
